name: Build AnbarBan Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android and Windows platform files
        run: flutter create --platforms=android,windows --project-name anbarban .

      - name: Set and verify Android compile SDK to 36
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import re, sys

          files = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]
          path = next((p for p in files if p.exists()), None)
          if path is None:
              sys.exit("خطا: فایل Gradle برنامه پیدا نشد.")

          text = path.read_text()
          patterns = [
              r"(?m)^([ \t]*compileSdk[ \t]*=[ \t]*).*$",
              r"(?m)^([ \t]*compileSdkVersion[ \t]+).*$",
              r"(?m)^([ \t]*compileSdk[ \t]+).*$",
          ]

          for pattern in patterns:
              updated, count = re.subn(pattern, r"\g<1>36", text, count=1)
              if count:
                  text = updated
                  break
          else:
              sys.exit("خطا: خط compileSdk در فایل Gradle پیدا نشد.")

          path.write_text(text)
          print(f"فایل تنظیم‌شده: {path}")
          for line in text.splitlines():
              if re.match(r"^\s*compileSdk(?:Version)?\b", line):
                  print(f"تنظیم نهایی: {line.strip()}")
                  if not re.search(r"\b36\b", line):
                      sys.exit("خطا: compileSdk برابر 36 نیست.")
                  break
          else:
              sys.exit("خطا: مقدار compileSdk تأیید نشد.")
          PYCODE

      - name: Get dependencies
        run: flutter pub get

      - name: Remove incompatible default test
        run: rm -f test/widget_test.dart

      - name: Check Dart code
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: anbarban-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
